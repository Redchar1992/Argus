spring:
  datasource:
    url: jdbc:h2:mem:storyforge;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true

app:
  jwt:
    # Development-only fallback. Production uses application-mysql.yml and
    # requires JWT_SECRET from the environment instead.
    secret: ${JWT_SECRET:story-forge-local-secret-key-change-me-2026}
