spring:
  application:
    name: story-forge-backend
  profiles:
    default: local
  jackson:
    default-property-inclusion: non_null
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3s}
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:8080}
  # Honor Forwarded/X-Forwarded-* values added by the trusted pilot reverse proxy.
  # The deploy stack keeps the backend bound to loopback so clients cannot bypass it.
  forward-headers-strategy: framework

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  auth:
    rate-limit:
      enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
      window-type: ${AUTH_RATE_LIMIT_WINDOW_TYPE:SLIDING}
      registration:
        max-attempts: ${AUTH_REGISTER_RATE_LIMIT_MAX:5}
        window: ${AUTH_REGISTER_RATE_LIMIT_WINDOW:1h}
      login:
        max-attempts: ${AUTH_LOGIN_RATE_LIMIT_MAX:10}
        window: ${AUTH_LOGIN_RATE_LIMIT_WINDOW:15m}
      # Bounds attacker-controlled IP/username keys to prevent unbounded heap growth.
      max-entries: ${AUTH_RATE_LIMIT_MAX_ENTRIES:20000}
  jwt:
    # Never provide a shared signing key from the common configuration. The
    # local profile supplies a development-only fallback; deployable profiles
    # must provide JWT_SECRET explicitly and fail during configuration binding
    # when it is absent.
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:86400000}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout: ${AI_CONNECT_TIMEOUT:3s}
    # Must exceed the AI provider's 30s timeout so FastAPI has time to return
    # its explicit local-template fallback instead of being cut off mid-fallback.
    read-timeout: ${AI_READ_TIMEOUT:45s}
    internal-api-key: ${AI_INTERNAL_API_KEY:}
    final-review-max-chars: ${FINAL_REVIEW_MAX_CHARS:500000}
    # Workflow reservations remain available during manual review until this TTL.
    workflow-review-timeout-hours: ${AI_WORKFLOW_REVIEW_TIMEOUT_HOURS:24}
    # A small periodic sweep releases reservations whose review TTL has elapsed.
    quota-expiry-interval-ms: ${AI_QUOTA_EXPIRY_INTERVAL_MS:60000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  workflow:
    redis-enabled: ${WORKFLOW_REDIS_ENABLED:false}
    request-stream: ${WORKFLOW_REQUEST_STREAM:story:workflow:requests}
    event-stream: ${WORKFLOW_EVENT_STREAM:story:workflow:events}
    event-group: ${WORKFLOW_EVENT_GROUP:storyforge-backend}
    event-consumer: ${WORKFLOW_EVENT_CONSUMER:backend-1}
    poll-timeout: ${WORKFLOW_POLL_TIMEOUT:2s}
    batch-size: ${WORKFLOW_BATCH_SIZE:10}
    reclaim-idle: ${WORKFLOW_RECLAIM_IDLE:60s}
    # @Scheduled string delays require a numeric millisecond value in Spring 6.1.
    reclaim-interval-ms: ${WORKFLOW_RECLAIM_INTERVAL_MS:10000}
    reclaim-batch-size: ${WORKFLOW_RECLAIM_BATCH_SIZE:20}
  chapter-workflow:
    redis-enabled: ${CHAPTER_WORKFLOW_REDIS_ENABLED:false}
    command-stream: ${CHAPTER_COMMAND_STREAM:story:chapter:commands}
    event-stream: ${CHAPTER_EVENT_STREAM:story:chapter:events}
    event-group: ${CHAPTER_EVENT_GROUP:storyforge-chapter-backend}
    event-consumer: ${CHAPTER_EVENT_CONSUMER:chapter-backend-1}
    poll-timeout: ${CHAPTER_POLL_TIMEOUT:1s}
    batch-size: ${CHAPTER_EVENT_BATCH_SIZE:50}
    reclaim-idle: ${CHAPTER_RECLAIM_IDLE:60s}
    reclaim-interval-ms: ${CHAPTER_RECLAIM_INTERVAL_MS:10000}
    reclaim-batch-size: ${CHAPTER_RECLAIM_BATCH_SIZE:50}
    stream-max-length: ${CHAPTER_STREAM_MAX_LENGTH:100000}
    event-retention-per-task: ${CHAPTER_EVENT_RETENTION_PER_TASK:10000}
    sse-timeout-ms: ${CHAPTER_SSE_TIMEOUT_MS:1800000}
  export:
    storage-dir: ${EXPORT_STORAGE_DIR:./data/exports}
    download-ttl-minutes: ${EXPORT_DOWNLOAD_TTL_MINUTES:15}
  pilot:
    # Disabled when blank. Pilot deployments must provide a server-only key.
    metrics-key: ${PILOT_METRICS_KEY:}

logging:
  level:
    com.storyforge: INFO
