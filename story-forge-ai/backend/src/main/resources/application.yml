spring:
  application:
    name: story-forge-backend
  profiles:
    default: local
  jackson:
    default-property-inclusion: non_null
  data:
    redis:
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:8080}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  jwt:
    secret: ${JWT_SECRET:story-forge-local-secret-key-change-me-2026}
    expiration: ${JWT_EXPIRATION:86400000}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout: ${AI_CONNECT_TIMEOUT:3s}
    # Must exceed the AI provider's 30s timeout so FastAPI has time to return
    # its explicit local-template fallback instead of being cut off mid-fallback.
    read-timeout: ${AI_READ_TIMEOUT:45s}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.storyforge: INFO
