services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-story_forge}
      MYSQL_USER: ${MYSQL_USER:-story_forge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set a random MYSQL_PASSWORD in deploy/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a random MYSQL_ROOT_PASSWORD in deploy/.env}
    ports:
      - "${MYSQL_BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - story-forge-mysql:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    command:
      [
        "sh",
        "-c",
        "exec redis-server --appendonly yes --maxmemory \"$${REDIS_MAXMEMORY}\" --maxmemory-policy noeviction --requirepass \"$${REDIS_PASSWORD}\"",
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a random REDIS_PASSWORD in deploy/.env}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-128mb}
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - story-forge-redis:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: ../ai-service
    environment:
      MODEL_PROVIDER: ${MODEL_PROVIDER:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_CREATIVE_MODEL: ${OPENAI_CREATIVE_MODEL:-${OPENAI_MODEL:-gpt-4.1-mini}}
      OPENAI_REVIEW_MODEL: ${OPENAI_REVIEW_MODEL:-${OPENAI_MODEL:-gpt-4.1-mini}}
      OPENAI_FALLBACK_ENABLED: ${OPENAI_FALLBACK_ENABLED:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set a random REDIS_PASSWORD in deploy/.env}@redis:6379/0
      AI_INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY:?Set a random AI_INTERNAL_API_KEY in deploy/.env}
      AI_REQUIRE_INTERNAL_API_KEY: "true"
      AI_REQUIRE_REMOTE_MODEL: ${AI_REQUIRE_REMOTE_MODEL:-false}
      STORY_CHECKPOINT_DB: /data/story/story-checkpoints.sqlite
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # Keep HTTP and worker checkpoints in the same named-volume path.
      - story-forge-story-checkpoints:/data/story
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  ai-worker:
    build:
      context: ../ai-service
    command: ["python", "-m", "app.workers.story_worker"]
    environment:
      MODEL_PROVIDER: ${MODEL_PROVIDER:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_CREATIVE_MODEL: ${OPENAI_CREATIVE_MODEL:-${OPENAI_MODEL:-gpt-4.1-mini}}
      OPENAI_REVIEW_MODEL: ${OPENAI_REVIEW_MODEL:-${OPENAI_MODEL:-gpt-4.1-mini}}
      OPENAI_FALLBACK_ENABLED: ${OPENAI_FALLBACK_ENABLED:-true}
      AI_REQUIRE_REMOTE_MODEL: ${AI_REQUIRE_REMOTE_MODEL:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set a random REDIS_PASSWORD in deploy/.env}@redis:6379/0
      REDIS_REQUEST_STREAM: story:workflow:requests
      REDIS_EVENT_STREAM: story:workflow:events
      REDIS_CONSUMER_GROUP: story-workflow-workers
      STORY_CHECKPOINT_DB: /data/story/story-checkpoints.sqlite
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      redis:
        condition: service_healthy
    # The shared image checks the FastAPI HTTP port by default; this container
    # intentionally runs only the Redis worker process.
    healthcheck:
      disable: true
    restart: unless-stopped

  chapter-worker:
    build:
      context: ../ai-service
    command: ["python", "-m", "app.workers.chapter_worker"]
    environment:
      MODEL_PROVIDER: ${MODEL_PROVIDER:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_CREATIVE_MODEL: ${OPENAI_CREATIVE_MODEL:-${OPENAI_MODEL:-gpt-4.1-mini}}
      OPENAI_REVIEW_MODEL: ${OPENAI_REVIEW_MODEL:-${OPENAI_MODEL:-gpt-4.1-mini}}
      OPENAI_FALLBACK_ENABLED: ${OPENAI_FALLBACK_ENABLED:-true}
      AI_REQUIRE_REMOTE_MODEL: ${AI_REQUIRE_REMOTE_MODEL:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set a random REDIS_PASSWORD in deploy/.env}@redis:6379/0
      CHAPTER_COMMAND_STREAM: story:chapter:commands
      CHAPTER_EVENT_STREAM: story:chapter:events
      CHAPTER_CONSUMER_GROUP: story-chapter-workers
      CHAPTER_EVENT_MAXLEN: ${CHAPTER_EVENT_MAXLEN:-100000}
      CHAPTER_MAX_ATTEMPTS: ${CHAPTER_MAX_ATTEMPTS:-3}
      CHAPTER_CHECKPOINT_DB: /data/chapter-checkpoints.sqlite
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - story-forge-chapter-checkpoints:/data
      - story-forge-story-checkpoints:/data/story
    depends_on:
      redis:
        condition: service_healthy
    # This container consumes Redis commands and intentionally exposes no HTTP port.
    healthcheck:
      disable: true
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      MYSQL_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-story_forge}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      MYSQL_USERNAME: ${MYSQL_USER:-story_forge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set a random MYSQL_PASSWORD in deploy/.env}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a random REDIS_PASSWORD in deploy/.env}
      WORKFLOW_REDIS_ENABLED: "true"
      WORKFLOW_REQUEST_STREAM: story:workflow:requests
      WORKFLOW_EVENT_STREAM: story:workflow:events
      WORKFLOW_EVENT_GROUP: storyforge-backend
      WORKFLOW_EVENT_CONSUMER: backend-1
      WORKFLOW_RECLAIM_INTERVAL_MS: ${WORKFLOW_RECLAIM_INTERVAL_MS:-10000}
      CHAPTER_WORKFLOW_REDIS_ENABLED: "true"
      CHAPTER_COMMAND_STREAM: story:chapter:commands
      CHAPTER_EVENT_STREAM: story:chapter:events
      CHAPTER_EVENT_GROUP: storyforge-chapter-backend
      CHAPTER_EVENT_CONSUMER: chapter-backend-1
      CHAPTER_RECLAIM_INTERVAL_MS: ${CHAPTER_RECLAIM_INTERVAL_MS:-10000}
      CHAPTER_STREAM_MAX_LENGTH: ${CHAPTER_EVENT_MAXLEN:-100000}
      CHAPTER_EVENT_RETENTION_PER_TASK: ${CHAPTER_EVENT_RETENTION_PER_TASK:-10000}
      CHAPTER_SSE_TIMEOUT_MS: ${CHAPTER_SSE_TIMEOUT_MS:-1800000}
      AI_SERVICE_URL: http://ai-service:8000
      AI_READ_TIMEOUT: 45s
      AI_INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY:?Set the same AI_INTERNAL_API_KEY as ai-service}
      FINAL_REVIEW_MAX_CHARS: ${FINAL_REVIEW_MAX_CHARS:-500000}
      AI_WORKFLOW_REVIEW_TIMEOUT_HOURS: ${AI_WORKFLOW_REVIEW_TIMEOUT_HOURS:-24}
      AI_QUOTA_EXPIRY_INTERVAL_MS: ${AI_QUOTA_EXPIRY_INTERVAL_MS:-60000}
      EXPORT_STORAGE_DIR: /data/exports
      EXPORT_DOWNLOAD_TTL_MINUTES: ${EXPORT_DOWNLOAD_TTL_MINUTES:-15}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET in deploy/.env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      AUTH_RATE_LIMIT_ENABLED: ${AUTH_RATE_LIMIT_ENABLED:-true}
      AUTH_RATE_LIMIT_WINDOW_TYPE: ${AUTH_RATE_LIMIT_WINDOW_TYPE:-SLIDING}
      AUTH_REGISTER_RATE_LIMIT_MAX: ${AUTH_REGISTER_RATE_LIMIT_MAX:-5}
      AUTH_REGISTER_RATE_LIMIT_WINDOW: ${AUTH_REGISTER_RATE_LIMIT_WINDOW:-1h}
      AUTH_LOGIN_RATE_LIMIT_MAX: ${AUTH_LOGIN_RATE_LIMIT_MAX:-10}
      AUTH_LOGIN_RATE_LIMIT_WINDOW: ${AUTH_LOGIN_RATE_LIMIT_WINDOW:-15m}
      AUTH_RATE_LIMIT_MAX_ENTRIES: ${AUTH_RATE_LIMIT_MAX_ENTRIES:-20000}
      PILOT_METRICS_KEY: ${PILOT_METRICS_KEY:-}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    volumes:
      - story-forge-exports:/data/exports
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  story-forge-mysql:
  story-forge-redis:
  story-forge-chapter-checkpoints:
  story-forge-story-checkpoints:
  story-forge-exports:
