[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "story-forge-ai-service"
version = "0.3.0"
description = "Interruptible story and chapter-generation agents for Story Forge"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20,<1.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "langchain>=1.3,<2.0",
  "langgraph>=1.2,<2.0",
  "langgraph-checkpoint-sqlite>=3.0,<4.0",
  "pydantic>=2.10,<3.0",
  "redis>=5.2,<8.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "fakeredis>=2.26,<3.0",
  "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
