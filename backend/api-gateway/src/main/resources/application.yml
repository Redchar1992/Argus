server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                  - "http://localhost:5174"
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true
          routes:
            - id: auth-service
              uri: ${ARGUS_AUTH_URI:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
            - id: orchestrator-service
              uri: ${ARGUS_ORCHESTRATOR_URI:http://localhost:8082}
              predicates:
                - Path=/api/investigations/**
            - id: tools-service
              uri: ${ARGUS_TOOLS_URI:http://localhost:8083}
              predicates:
                - Path=/api/tools/**
            - id: case-service
              uri: ${ARGUS_CASE_URI:http://localhost:8084}
              predicates:
                - Path=/api/cases/**, /api/policies/**, /api/audit/**

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: prod
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ${ARGUS_ALLOWED_ORIGINS}
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true
          # Identity is intentionally BFF-only in production. Do not expose the
          # mTLS-protected auth-service through a gateway that lacks a client cert.
          routes:
            - id: orchestrator-service
              uri: ${ARGUS_ORCHESTRATOR_URI}
              predicates:
                - Path=/api/investigations/**
            - id: tools-service
              uri: ${ARGUS_TOOLS_URI}
              predicates:
                - Path=/api/tools/**
            - id: case-service
              uri: ${ARGUS_CASE_URI}
              predicates:
                - Path=/api/cases/**, /api/policies/**, /api/audit/**
