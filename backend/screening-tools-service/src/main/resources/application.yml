server:
  port: 8083

spring:
  application:
    name: screening-tools-service
  datasource:
    url: jdbc:h2:mem:toolsdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: false

argus:
  demo:
    seed: ${ARGUS_DEMO_SEED:true}
  jwt:
    public-keys: ${ARGUS_AUTH_JWT_PUBLIC_KEYS:}
    issuer: ${ARGUS_AUTH_JWT_ISSUER:urn:argus:auth}
    audience: ${ARGUS_ADMIN_JWT_AUDIENCE:argus-admin-api}
  workload:
    jwt:
      public-keys: ${ARGUS_WORKLOAD_JWT_PUBLIC_KEYS:}
      issuer: ${ARGUS_WORKLOAD_JWT_ISSUER:urn:argus:workload}
      audience: ${ARGUS_TOOLS_WORKLOAD_JWT_AUDIENCE:argus-screening-tools}

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${ARGUS_TOOLS_PG_URL:${ARGUS_PG_URL:jdbc:postgresql://localhost:5432/argus}}
    driver-class-name: org.postgresql.Driver
    username: ${ARGUS_PG_USER:argus}
    password: ${ARGUS_PG_PASSWORD:argus}
  flyway:
    enabled: true
    schemas: tools
    default-schema: tools
    create-schemas: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: tools

---
argus:
  demo:
    seed: false

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${ARGUS_TOOLS_PG_URL}
    driver-class-name: org.postgresql.Driver
    username: ${ARGUS_PG_USER}
    password: ${ARGUS_PG_PASSWORD}
  flyway:
    enabled: true
    schemas: tools
    default-schema: tools
    create-schemas: false
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: tools
