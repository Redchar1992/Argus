server:
  port: 8083

spring:
  application:
    name: screening-tools-service
  datasource:
    url: jdbc:h2:mem:toolsdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: false

argus:
  demo:
    seed: ${ARGUS_DEMO_SEED:true}
  jwt:
    public-keys: ${ARGUS_AUTH_JWT_PUBLIC_KEYS:}
    issuer: ${ARGUS_AUTH_JWT_ISSUER:urn:argus:auth}
    audience: ${ARGUS_ADMIN_JWT_AUDIENCE:argus-admin-api}
  workload:
    jwt:
      public-keys: ${ARGUS_WORKLOAD_JWT_PUBLIC_KEYS:}
      issuer: ${ARGUS_WORKLOAD_JWT_ISSUER:urn:argus:workload}
      audience: ${ARGUS_TOOLS_WORKLOAD_JWT_AUDIENCE:argus-screening-tools}
  screening:
    providers: ${ARGUS_SCREENING_PROVIDERS:local,ofac}
    local:
      required: ${ARGUS_LOCAL_SCREENING_REQUIRED:true}
    ofac:
      # The default is an explicitly labelled two-address official-format snapshot so
      # local demos stay offline/deterministic. Prod below requires the complete live feed.
      source-uri: ${ARGUS_OFAC_SOURCE_URI:classpath:fixtures/ofac-sdn-advanced-excerpt.xml}
      required: ${ARGUS_OFAC_REQUIRED:true}
      refresh-on-startup: ${ARGUS_OFAC_REFRESH_ON_STARTUP:true}
      refresh-cron: ${ARGUS_OFAC_REFRESH_CRON:0 0 3 * * *}
      refresh-if-older-than: ${ARGUS_OFAC_REFRESH_IF_OLDER_THAN:PT6H}
      max-age: ${ARGUS_OFAC_MAX_AGE:PT48H}
      request-timeout: ${ARGUS_OFAC_REQUEST_TIMEOUT:PT180S}
      max-bytes: ${ARGUS_OFAC_MAX_BYTES:200000000}
      minimum-address-count: ${ARGUS_OFAC_MINIMUM_ADDRESS_COUNT:1}
      user-agent: ${ARGUS_OFAC_USER_AGENT:ArgusComplianceDemo/0.1}

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${ARGUS_TOOLS_PG_URL:${ARGUS_PG_URL:jdbc:postgresql://localhost:5432/argus}}
    driver-class-name: org.postgresql.Driver
    username: ${ARGUS_PG_USER:argus}
    password: ${ARGUS_PG_PASSWORD:argus}
  flyway:
    enabled: true
    schemas: tools
    default-schema: tools
    create-schemas: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: tools

---
argus:
  demo:
    seed: false
  screening:
    providers: ofac
    ofac:
      source-uri: https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/SDN_ADVANCED.XML
      required: true
      refresh-on-startup: true
      minimum-address-count: 100

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${ARGUS_TOOLS_PG_URL}
    driver-class-name: org.postgresql.Driver
    username: ${ARGUS_PG_USER}
    password: ${ARGUS_PG_PASSWORD}
  flyway:
    enabled: true
    schemas: tools
    default-schema: tools
    create-schemas: false
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: tools
