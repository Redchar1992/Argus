server:
  port: 8081
  ssl:
    enabled: ${ARGUS_AUTH_TLS_ENABLED:false}
    key-store: ${ARGUS_AUTH_TLS_KEY_STORE:}
    key-store-password: ${ARGUS_AUTH_TLS_KEY_STORE_PASSWORD:}
    key-store-type: PKCS12
    trust-store: ${ARGUS_AUTH_TLS_TRUST_STORE:}
    trust-store-password: ${ARGUS_AUTH_TLS_TRUST_STORE_PASSWORD:}
    trust-store-type: PKCS12
    client-auth: ${ARGUS_AUTH_TLS_CLIENT_AUTH:none}
    enabled-protocols: TLSv1.2,TLSv1.3

spring:
  application:
    name: auth-service
  # Default profile uses an in-memory H2 store so the service runs with zero infra.
  # Activate the 'postgres' profile (SPRING_PROFILES_ACTIVE=postgres) to use Postgres.
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

argus:
  jwt:
    # Demo secret. In production this MUST come from the environment (ARGUS_JWT_SECRET).
    secret: ${ARGUS_JWT_SECRET:argus-dev-secret-change-me-please-32bytes-minimum-length}
    expiry-seconds: 3600
  oidc:
    enabled: ${ARGUS_OIDC_ENABLED:false}
    issuer: ${ARGUS_OIDC_ISSUER:}
    audience: ${ARGUS_OIDC_AUDIENCE:}
  identity:
    # Comma-separated kid:base64 AES-256 keys. Keep retired keys during rotation.
    primary-key-id: ${ARGUS_IDENTITY_PRIMARY_KEY_ID:dev-v1}
    keys: ${ARGUS_IDENTITY_KEYS:dev-v1:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  mfa:
    challenge-ttl-seconds: ${ARGUS_MFA_CHALLENGE_TTL_SECONDS:300}
    enrollment-ttl-seconds: ${ARGUS_MFA_ENROLLMENT_TTL_SECONDS:600}
    maximum-attempts: ${ARGUS_MFA_MAXIMUM_ATTEMPTS:5}
  recovery:
    pepper: ${ARGUS_RECOVERY_PEPPER:YXJndXMtcmVjb3ZlcnktZGV2LXBlcHBlci1rZXktdjE=}
  internal:
    bff-secret: ${ARGUS_INTERNAL_BFF_SECRET:argus-dev-internal-bff-secret-change-me}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      service: auth-service
      region: ${ARGUS_REGION:local}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${ARGUS_PG_URL:jdbc:postgresql://localhost:5432/argus}
    driver-class-name: org.postgresql.Driver
    username: ${ARGUS_PG_USER:argus}
    password: ${ARGUS_PG_PASSWORD:argus}
  jpa:
    hibernate:
      ddl-auto: update
