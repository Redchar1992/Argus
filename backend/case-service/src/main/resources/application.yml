server:
  port: 8084

spring:
  application:
    name: case-service
  datasource:
    url: jdbc:h2:mem:casedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: false

argus:
  jwt:
    public-keys: ${ARGUS_AUTH_JWT_PUBLIC_KEYS:}
    issuer: ${ARGUS_AUTH_JWT_ISSUER:urn:argus:auth}
    audience: ${ARGUS_ADMIN_JWT_AUDIENCE:argus-admin-api}
  workload:
    jwt:
      public-keys: ${ARGUS_WORKLOAD_JWT_PUBLIC_KEYS:}
      issuer: ${ARGUS_WORKLOAD_JWT_ISSUER:urn:argus:workload}
      audience: ${ARGUS_CASE_WORKLOAD_JWT_AUDIENCE:argus-case-service}

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${ARGUS_CASE_PG_URL:${ARGUS_PG_URL:jdbc:postgresql://localhost:5432/argus}}
    driver-class-name: org.postgresql.Driver
    username: ${ARGUS_PG_USER:argus}
    password: ${ARGUS_PG_PASSWORD:argus}
  flyway:
    enabled: true
    schemas: cases
    default-schema: cases
    create-schemas: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: cases

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${ARGUS_CASE_PG_URL}
    driver-class-name: org.postgresql.Driver
    username: ${ARGUS_PG_USER}
    password: ${ARGUS_PG_PASSWORD}
  flyway:
    enabled: true
    schemas: cases
    default-schema: cases
    create-schemas: false
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: cases
