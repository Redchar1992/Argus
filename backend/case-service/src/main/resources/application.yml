server:
  port: 8084

spring:
  application:
    name: case-service
  datasource:
    url: jdbc:h2:mem:casedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: false

argus:
  jwt:
    # MUST match auth-service's signing secret (shared HMAC). Supplied via env in prod.
    secret: ${ARGUS_JWT_SECRET:argus-dev-secret-change-me-please-32bytes-minimum-length}

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${ARGUS_CASE_PG_URL:${ARGUS_PG_URL:jdbc:postgresql://localhost:5432/argus}}
    driver-class-name: org.postgresql.Driver
    username: ${ARGUS_PG_USER:argus}
    password: ${ARGUS_PG_PASSWORD:argus}
  flyway:
    enabled: true
    schemas: cases
    default-schema: cases
    create-schemas: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: cases

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${ARGUS_CASE_PG_URL}
    driver-class-name: org.postgresql.Driver
    username: ${ARGUS_PG_USER}
    password: ${ARGUS_PG_PASSWORD}
  flyway:
    enabled: true
    schemas: cases
    default-schema: cases
    create-schemas: false
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: cases
