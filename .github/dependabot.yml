version: 2
updates:
  - package-ecosystem: npm
    directory: /bff
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      spring-release-train-patches:
        patterns:
          - "org.springframework.boot:spring-boot-starter-parent"
          - "org.springframework.cloud:spring-cloud-dependencies"
        update-types: [patch]
      safe-non-major-updates:
        patterns: ["*"]
        exclude-patterns:
          - "org.springframework.boot:spring-boot-starter-parent"
          - "org.springframework.cloud:spring-cloud-dependencies"
        update-types: [minor, patch]
    ignore:
      # Boot and Cloud release trains must be advanced together against the
      # official compatibility matrix. Dependabot may still propose patches.
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: "org.springframework.cloud:spring-cloud-dependencies"
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /frontend/analyst-console
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      safe-non-major-updates:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /frontend/admin-console
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      safe-non-major-updates:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      safe-non-major-updates:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      action-updates:
        patterns: ["*"]
