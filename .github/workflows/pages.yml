name: Deploy Argus demo to Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/analyst-console/**'
      - 'frontend/admin-console/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/analyst-console/package-lock.json
      - name: Install and verify
        working-directory: frontend/analyst-console
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run test:unit
          npm run build:pages
          npx playwright install --with-deps chromium
          npm run test:e2e:pages
      - name: Build admin console static demo
        working-directory: frontend/admin-console
        env:
          VITE_STATIC_DEMO: 'true'
          VITE_BASE_PATH: /Argus/admin/
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run build
      - name: Assemble Pages artifact
        run: |
          mkdir -p frontend/analyst-console/dist/admin
          cp -R frontend/admin-console/dist/. frontend/analyst-console/dist/admin/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/analyst-console/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
