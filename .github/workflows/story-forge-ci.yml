name: StoryForge AI CI

on:
  push:
    branches: [main, develop]
    paths:
      - "story-forge-ai/**"
      - ".github/workflows/story-forge-ci.yml"
  pull_request:
    paths:
      - "story-forge-ai/**"
      - ".github/workflows/story-forge-ci.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: story-forge-ai/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: story-forge-ai/frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: story-forge-ai/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B verify

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: story-forge-ai/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            story-forge-ai/ai-service/requirements.txt
            story-forge-ai/ai-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - run: ruff check .
      - run: pip check

  operations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: story-forge-ai
    env:
      MYSQL_PASSWORD: test-mysql-password
      MYSQL_ROOT_PASSWORD: test-root-password
      REDIS_PASSWORD: test-redis-password
      AI_INTERNAL_API_KEY: test-ai-internal-key
      JWT_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      PILOT_METRICS_KEY: test-pilot-metrics-key-0123456789012345
      MODEL_PROVIDER: openai-compatible
      OPENAI_API_KEY: test-model-key
      PUBLIC_HOST: story.example.com
      ACME_EMAIL: ops@example.com
      PILOT_BASIC_AUTH_USER: pilot
      PILOT_BASIC_AUTH_HASH: '$2y$04$zrv/hNVIbsLkULv49fisC.r2UFZBI.erkY9boRHUBYj.JeSA0IpBO'
    steps:
      - uses: actions/checkout@v4
      - run: bash -n deploy/*.sh
      - run: deploy/test-backup-restore.sh
      - name: Validate pilot Compose stack
        run: >-
          docker compose
          --env-file deploy/pilot.env.example
          -f deploy/docker-compose.yml
          -f deploy/docker-compose.pilot.yml
          config --quiet
      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          -e ACME_EMAIL
          -e PUBLIC_HOST
          -e PILOT_BASIC_AUTH_USER
          -e PILOT_BASIC_AUTH_HASH
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11.4-alpine
          caddy validate --config /etc/caddy/Caddyfile
