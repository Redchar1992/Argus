name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    name: Backend (Spring Cloud)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build + test
        working-directory: backend
        run: mvn -B -q package

  identity-bff:
    name: BFF (Node + Fastify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bff/package-lock.json
      - name: Install, build + test
        working-directory: bff
        run: |
          npm ci
          npm run build
          npm test

  analyst-console:
    name: Frontend (React analyst-console)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/analyst-console/package-lock.json
      - name: Install, build + unit test
        working-directory: frontend/analyst-console
        run: |
          npm ci
          npm run build
          npm run test:unit

  analyst-console-e2e:
    name: Identity flow (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            bff/package-lock.json
            frontend/analyst-console/package-lock.json
      - name: Install BFF
        working-directory: bff
        run: npm ci
      - name: Install analyst console
        working-directory: frontend/analyst-console
        run: npm ci
      - name: Install Chromium
        working-directory: frontend/analyst-console
        run: npx playwright install --with-deps chromium
      - name: Run browser login journeys
        working-directory: frontend/analyst-console
        run: npm run test:e2e

  admin-console:
    name: Frontend (Vue admin-console)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/admin-console/package-lock.json
      - name: Install + build
        working-directory: frontend/admin-console
        run: |
          npm ci
          npm run build
