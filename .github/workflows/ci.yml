name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    name: Backend (Spring Cloud)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build + test
        working-directory: backend
        run: mvn -B -q package
      - name: Verify Flyway migrations on Postgres
        run: ./scripts/verify-postgres-migrations.sh --skip-build

  identity-bff:
    name: BFF (Node + Fastify)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      BFF_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bff/package-lock.json
      - name: Install, build + test
        working-directory: bff
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run build
          npm test

  identity-resilience-drill:
    name: Identity resilience (TLS multi-region drill)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17 for local PKI trust store
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bff/package-lock.json
      - name: Install BFF dependencies
        working-directory: bff
        run: npm ci
      - name: Exercise regional loss and TLS Redis promotion
        run: ./infra/drills/run-multi-region-auth-drill.sh

  analyst-console:
    name: Frontend (React analyst-console)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/analyst-console/package-lock.json
      - name: Install, build + unit test
        working-directory: frontend/analyst-console
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run build
          npm run test:unit

  analyst-console-e2e:
    name: Identity flow (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            bff/package-lock.json
            frontend/analyst-console/package-lock.json
      - name: Install BFF
        working-directory: bff
        run: npm ci
      - name: Install analyst console
        working-directory: frontend/analyst-console
        run: npm ci
      - name: Install Chromium
        working-directory: frontend/analyst-console
        run: npx playwright install --with-deps chromium
      - name: Run browser login journeys
        working-directory: frontend/analyst-console
        run: npm run test:e2e

  real-stack-demo-e2e:
    name: Local demo (real stack Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            bff/package-lock.json
            frontend/analyst-console/package-lock.json
      - name: Install BFF
        working-directory: bff
        run: npm ci
      - name: Install analyst console and Chromium
        working-directory: frontend/analyst-console
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the product journeys against real services
        run: |
          trap './scripts/demo-down.sh --quiet' EXIT
          ./scripts/demo-up.sh --lite
          ./scripts/demo-verify.sh

  admin-console:
    name: Frontend (Vue admin-console)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/admin-console/package-lock.json
      - name: Install + build
        working-directory: frontend/admin-console
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run build
